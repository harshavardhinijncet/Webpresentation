# Render blueprint. Commit this at the repo root and Render picks it up.
#
# The app has zero runtime dependencies and serves both the API and the
# frontend from one Node process, so there is nothing to build — the whole
# deployment is "check out the repo and run the server".
services:
  - type: web
    name: webpresentation
    runtime: node
    plan: free
    # Nothing to install: package.json has no dependencies. Kept explicit so a
    # future dependency is not silently skipped.
    buildCommand: npm install --prefix backend
    startCommand: node backend/src/server.js
    # Render polls this to decide the instance is up. Answering it is also what
    # a keep-alive pinger hits to stop the free plan idling — see DEPLOY.md.
    healthCheckPath: /api/health
    envVars:
      # The default is 127.0.0.1, which inside a container accepts no traffic
      # at all: the deploy goes green and every request times out. This is the
      # single most important line in the file.
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: "20"
      # Render terminates TLS in front of the app, so the session cookie can be
      # marked Secure. Left off locally, where the deck is served over http.
      - key: COOKIE_SECURE
        value: "1"
